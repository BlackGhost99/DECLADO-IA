# Configuration des exonérations et préférences tarifaires
# Source: Codes douaniers CEMAC et accords bilatéraux/multilatéraux

# Exonérations totales (DD + TVA)
exemptions:
  EXO_DIPLO:
    name: "Privilèges diplomatiques"
    description: "Exonération totale pour missions diplomatiques et consulaires"
    applies_to:
      - "customs_duty"
      - "vat"
      - "other_taxes"
    required_documents:
      - "Attestation du Ministère des Affaires Étrangères"
      - "Carte diplomatique"
      - "Note verbale"
    validity: "permanent"
  
  EXO_ONG:
    name: "Organisations internationales et ONG"
    description: "Exonération pour organisations internationales reconnues"
    applies_to:
      - "customs_duty"
      - "vat"
    required_documents:
      - "Agrément ONG"
      - "Attestation d'exonération délivrée par les Douanes"
      - "Certificat d'utilité publique"
    validity: "renewable_annually"
  
  EXO_INV_AGRO:
    name: "Investissements agro-industriels"
    description: "Exonération pour matériel agricole et agro-industriel"
    applies_to:
      - "customs_duty"
    hs_codes:
      - "84" # Machines agricoles
      - "8701" # Tracteurs
      - "8432" # Machines agricoles
    duration_years: 5
    required_documents:
      - "Agrément d'investissement"
      - "Attestation d'exonération"
    validity: "5_years"
  
  EXO_MEDICAL:
    name: "Médicaments essentiels"
    description: "Exonération pour médicaments de la liste OMS"
    applies_to:
      - "customs_duty"
      - "vat"
    hs_codes:
      - "3003" # Médicaments
      - "3004" # Médicaments conditionnés
    required_documents:
      - "Certificat d'importation médicaments"
      - "Autorisation du Ministère de la Santé"
    validity: "per_shipment"
  
  EXO_EDUCATION:
    name: "Matériel éducatif"
    description: "Exonération pour livres et matériel pédagogique"
    applies_to:
      - "customs_duty"
      - "vat"
    hs_codes:
      - "4901" # Livres
      - "4902" # Journaux
      - "9023" # Matériel pédagogique
    required_documents:
      - "Certificat d'établissement d'enseignement"
      - "Liste détaillée des articles"
    validity: "per_shipment"

# Préférences tarifaires (réduction partielle des droits)
preferential_tariffs:
  # Accord de Partenariat Économique (APE) UE-CEMAC
  APE_EU:
    name: "Accord de Partenariat Économique UE-CEMAC"
    origin_countries:
      - "FR" # France
      - "DE" # Allemagne
      - "IT" # Italie
      - "ES" # Espagne
      - "BE" # Belgique
      - "NL" # Pays-Bas
      # ... tous pays UE
    reduction_rate: 80  # Réduction de 80% des droits de douane
    applies_to:
      - "customs_duty"
    required_documents:
      - "Certificat EUR.1"
      - "Déclaration d'origine"
    effective_date: "2023-01-01"
    notes: "Démantèlement tarifaire progressif sur 15 ans"
  
  # Zone de Libre-Échange Continentale Africaine (ZLECAf)
  ZLECAF:
    name: "Zone de Libre-Échange Continentale Africaine"
    origin_countries:
      - "SN" # Sénégal
      - "GH" # Ghana
      - "KE" # Kenya
      - "ZA" # Afrique du Sud
      # ... pays membres ZLECAf
    reduction_rate: 90  # Réduction progressive jusqu'à 90%
    applies_to:
      - "customs_duty"
    required_documents:
      - "Certificat d'origine ZLECAf"
      - "Déclaration de conformité aux règles d'origine"
    effective_date: "2021-01-01"
    phase_in_years: 10
  
  # Préférence CEMAC (intracommunautaire)
  CEMAC_INTERNAL:
    name: "Échanges intracommunautaires CEMAC"
    origin_countries:
      - "CM" # Cameroun
      - "GA" # Gabon
      - "CG" # Congo
      - "CF" # Centrafrique
      - "TD" # Tchad
      - "GQ" # Guinée Équatoriale
    reduction_rate: 100  # Exonération totale pour produits d'origine CEMAC
    applies_to:
      - "customs_duty"
    required_documents:
      - "Certificat d'origine CEMAC (formulaire C10)"
      - "Attestation de circulation des marchandises"
    notes: "Libre circulation des marchandises d'origine CEMAC"

# Régimes économiques douaniers (suspensions temporaires)
economic_regimes:
  ADMISSION_TEMPORAIRE:
    name: "Admission temporaire"
    description: "Suspension des droits pour marchandises réexportées"
    reduction_rate: 100  # Suspension totale
    duration_months: 6
    renewable: true
    required_documents:
      - "Déclaration d'admission temporaire"
      - "Engagement de réexportation"
      - "Caution bancaire"
  
  ENTREPOT_FICTIF:
    name: "Entrepôt fictif"
    description: "Suspension des droits pour transformation et réexportation"
    reduction_rate: 100
    duration_months: 12
    required_documents:
      - "Agrément entrepôt fictif"
      - "Programme de transformation"
      - "Caution"
  
  PERFECTIONNEMENT_ACTIF:
    name: "Perfectionnement actif"
    description: "Suspension pour transformation de produits réexportés"
    reduction_rate: 100
    duration_months: 12
    required_documents:
      - "Autorisation de perfectionnement actif"
      - "Engagement de réexportation"

# Règles d'origine
origin_rules:
  substantial_transformation:
    description: "Produit doit subir transformation substantielle"
    criteria:
      - "Changement de position tarifaire (4 premiers chiffres HS)"
      - "Valeur ajoutée locale ≥ 40%"
      - "Opérations manufacturières principales effectuées dans pays d'origine"
  
  cumulation:
    CEMAC:
      type: "full"
      description: "Cumul total entre pays CEMAC"
    APE_EU:
      type: "diagonal"
      description: "Cumul diagonal avec pays UE sous conditions"

# Validation des exonérations
validation:
  document_verification:
    - "Vérifier authenticité des certificats d'origine"
    - "Contrôler validité temporelle des attestations"
    - "Vérifier concordance entre documents et marchandises"
  
  retroactive_payment:
    description: "Exonération révoquée si conditions non respectées"
    penalty_rate: 150  # 150% des droits dus en cas de fraude
    interest_rate: 2.5  # 2.5% par mois de retard

notes: |
  - Les exonérations doivent être validées AVANT dédouanement
  - Documents d'origine doivent être originaux (pas de copies)
  - Certificats EUR.1 valides 10 mois après émission
  - Règles d'origine strictes pour préférences tarifaires
  - Contrôles a posteriori possibles (jusqu'à 3 ans)
  - Révocation d'exonération = paiement rétroactif + pénalités
