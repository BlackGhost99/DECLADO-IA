# Configuration des taux TEC (Tarif Extérieur Commun) CEMAC
# Source: Tarif des Douanes CEMAC 2024
#
# Structure:
#   - rates: taux TEC par code HS (en %)
#   - categories: catégories TEC (0%, 5%, 10%, 20%, 30%)
#
# NOTE: Ceci est une configuration simplifiée pour démonstration.
# En production, utiliser la base complète des taux TEC par code HS à 10 chiffres.

rates:
  # Catégorie 0: Biens de première nécessité, équipements de production
  "1006": 5    # Riz (produit de base)
  "0306": 10   # Crustacés (produits alimentaires)
  "1701": 5    # Sucre (produit de base)
  "1806": 20   # Chocolat (produits transformés)
  
  # Catégorie 1: Matières premières et biens d'équipement
  "5201": 5    # Coton brut (matière première)
  "4011": 10   # Pneumatiques (biens intermédiaires)
  
  # Catégorie 2: Biens intermédiaires et d'équipement
  "8467": 10   # Outils électroportatifs (équipement)
  "8517": 20   # Appareils téléphoniques (biens de consommation)
  
  # Catégorie 3: Biens de consommation courante
  "6109": 20   # T-shirts en coton (textile)
  "6205": 20   # Chemises (textile)
  "6110": 20   # Pulls et gilets (textile)
  
  # Catégorie 4: Biens de consommation finale et produits de luxe
  "7113": 30   # Bijoux (produits de luxe)
  "8703": 30   # Voitures de tourisme (véhicules)
  "2203": 30   # Bières (boissons alcoolisées)
  "2402": 30   # Cigares et cigarettes (produits du tabac)
  
  # Taux par préfixe (2 à 4 chiffres)
  "61": 20     # Vêtements tricotés
  "62": 20     # Vêtements non tricotés
  "84": 10     # Machines et appareils mécaniques
  "85": 20     # Machines et appareils électriques
  "87": 20     # Véhicules terrestres
  "71": 30     # Perles, pierres précieuses, métaux précieux
  "22": 30     # Boissons
  "24": 30     # Tabacs
  
  # Taux par défaut (si code HS non trouvé)
  default: 20  # Taux standard CEMAC: 20%

# Catégories TEC CEMAC (pour référence)
categories:
  0:
    rate: 0
    description: "Biens sociaux essentiels (médicaments, livres, etc.)"
    examples: ["3003", "3004", "4901", "4902"]
  
  1:
    rate: 5
    description: "Biens de première nécessité, matières premières de base, biens d'équipement"
    examples: ["1006", "1701", "5201", "1001"]
  
  2:
    rate: 10
    description: "Matières premières et produits intermédiaires"
    examples: ["0306", "4011", "8467", "7308"]
  
  3:
    rate: 20
    description: "Biens de consommation courante et finale"
    examples: ["6109", "6205", "8517", "8528"]
  
  4:
    rate: 30
    description: "Produits de consommation finale spécifiques"
    examples: ["7113", "8703", "2203", "2402"]

# Minima de perception (seuils minimaux de droits de douane)
# Certains produits ont un minimum de droits à payer même si le taux appliqué est bas
minima:
  default: 0  # Pas de minimum par défaut
  # Exemple: véhicules d'occasion ont souvent un minimum
  "8703": 500000  # Minimum 500,000 FCFA pour voitures

# Notes
notes: |
  - Les taux TEC sont harmonisés au niveau CEMAC depuis 1994
  - 5 catégories de taux: 0%, 5%, 10%, 20%, 30%
  - Le taux applicable dépend du code HS à 10 chiffres
  - Cette configuration est simplifiée (codes HS partiels)
  - En production, charger la nomenclature TEC complète depuis la base SYDONIA
