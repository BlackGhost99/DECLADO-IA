[pytest]
# Pytest configuration for DECLADO-IA Backend
# Phase 10: Tests, QA et Performance

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories
testpaths = tests
norecursedirs = .git .venv venv __pycache__ *.egg-info build dist

# Coverage settings
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
    -p no:warnings

# Markers for test categorization
markers =
    unit: Unit tests for isolated components
    integration: Integration tests across modules
    e2e: End-to-end pipeline tests
    performance: Performance profiling tests
    security: Security and vulnerability tests
    ml: Machine learning model tests
    slow: Tests that take significant time
    requires_tesseract: Tests requiring Tesseract OCR installed
    requires_mlflow: Tests requiring MLflow tracking server

# Async support
asyncio_mode = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Performance
timeout = 300
timeout_method = thread

# Disable warnings for specific packages
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::sklearn.exceptions.InconsistentVersionWarning
