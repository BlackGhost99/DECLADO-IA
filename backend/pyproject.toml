[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["apps/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
