name: ClairTransit CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clairtransit
          POSTGRES_PASSWORD: clairtransit
          POSTGRES_DB: clairtransit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clairtransit" --health-interval 5s --health-retries 10
    env:
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://clairtransit:clairtransit@localhost:5432/clairtransit
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Tesseract (OCR des scans, lot 3)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
      - run: pip install -r requirements-dev.txt
      - name: Style
        run: ruff check . && ruff format --check .
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run
      - name: Migrations applicables
        run: python manage.py migrate --noinput
      - name: Tests (droits, isolation, journal, extraction)
        run: python -m pytest -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
