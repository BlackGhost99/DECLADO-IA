name: Format regulatory module
on:
  push:
    branches: [feature/document-regulatory-referential]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/document-regulatory-referential
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.10
      - name: Format only new files
        run: ruff format backend/apps/regulations backend/tests/test_regulatory_engine.py
      - name: Commit generated formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/apps/regulations backend/tests/test_regulatory_engine.py
            git commit -m "style(regulations): apply Ruff formatter"
            git push origin HEAD:feature/document-regulatory-referential
          fi
