# ==========================================
# DECLADO-IA - Pre-commit Hooks Configuration
# ==========================================

repos:
  # ==========================================
  # Pre-commit hooks généraux
  # ==========================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: '\.json$'
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=10000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  # ==========================================
  # Python - Formatage avec Black
  # ==========================================
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.11
        args: ['--line-length=100']
        files: ^backend/

  # ==========================================
  # Python - Import sorting avec isort
  # ==========================================
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile', 'black', '--line-length', '100']
        files: ^backend/

  # ==========================================
  # Python - Linting avec Ruff
  # ==========================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.14
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']
        files: ^backend/

  # ==========================================
  # Python - Type checking avec mypy
  # ==========================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        files: ^backend/
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - types-python-dateutil
        args: ['--ignore-missing-imports', '--no-strict-optional']

  # ==========================================
  # Python - Security checks avec bandit
  # ==========================================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ['-c', 'backend/pyproject.toml', '-r', 'backend/app']
        files: ^backend/

  # ==========================================
  # JavaScript/TypeScript - Prettier
  # ==========================================
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx, json, css, scss]

  # ==========================================
  # JavaScript/TypeScript - ESLint
  # ==========================================
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        files: ^frontend/src/.*\.[jt]sx?$
        types: [file]
        additional_dependencies:
          - eslint@8.56.0
          - '@typescript-eslint/eslint-plugin@6.19.1'
          - '@typescript-eslint/parser@6.19.1'
          - eslint-plugin-react@7.33.2
          - eslint-plugin-react-hooks@4.6.0
          - eslint-config-prettier@9.1.0

  # ==========================================
  # Markdown - Linting
  # ==========================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: ['--fix']

  # ==========================================
  # Secrets detection
  # ==========================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock.json

# Configuration globale
default_language_version:
  python: python3.11
  node: 18.19.0

# Exécution en parallèle pour performances
default_stages: [commit]
fail_fast: false
