stages:
  ocr_pipeline:
    desc: "Run OCR pipeline on raw documents"
    cmd: python -m app.ocr_pipeline.cli data/raw data/outputs --lang eng+fra
    deps:
      - backend/app/ocr_pipeline
      - data/raw
    outs:
      - data/outputs
  ocr_eval:
    desc: "Compute aggregate CER baseline from outputs and ground truth"
    cmd: python -m app.ocr_pipeline.eval data/outputs data/metrics/cer.json
    deps:
      - backend/app/ocr_pipeline
      - data/outputs
    metrics:
      - data/metrics/cer.json:
          cache: false
