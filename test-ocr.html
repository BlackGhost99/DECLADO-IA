<!DOCTYPE html>
<html>
<head>
    <title>Test OCR Upload</title>
</head>
<body>
    <h1>Test OCR Upload</h1>
    <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff">
    <button onclick="uploadFile()">Upload & Process</button>
    <pre id="result"></pre>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) {
                alert('Select a file first');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);
            formData.append('lang', 'eng+fra');

            document.getElementById('result').textContent = 'Processing...';

            try {
                const response = await fetch('http://127.0.0.1:8000/api/ocr/process', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.text();
                    document.getElementById('result').textContent = `Error: ${error}`;
                    return;
                }

                const result = await response.json();
                document.getElementById('result').textContent = JSON.stringify(result, null, 2);
            } catch (err) {
                document.getElementById('result').textContent = `Exception: ${err.message}`;
            }
        }
    </script>
</body>
</html>
