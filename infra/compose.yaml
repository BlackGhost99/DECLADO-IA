# Environnement de développement complet. Données synthétiques uniquement.
# Lancement : docker compose -f infra/compose.yaml up --build
name: clairtransit

x-backend-env: &backend-env
  DJANGO_DEBUG: "true"
  DJANGO_SECRET_KEY: dev-only-change-me
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
  DATABASE_URL: postgres://clairtransit:clairtransit@db:5432/clairtransit
  CELERY_BROKER_URL: redis://redis:6379/0
  CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  PRIVATE_STORAGE_ROOT: /var/clairtransit/private
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"

services:
  clamav:
    image: clamav/clamav:1.4
    # Ne pas exposer le TCP non authentifié de clamd vers l'hôte.
    volumes: [clamdb:/var/lib/clamav]
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clairtransit
      POSTGRES_PASSWORD: clairtransit
      POSTGRES_DB: clairtransit
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clairtransit"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]

  backend:
    build: ../backend
    environment: *backend-env
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes: [private:/var/clairtransit/private]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      clamav: { condition: service_started }

  worker:
    build: ../backend
    environment: *backend-env
    command: celery -A config worker -B -l info  # -B : relance périodique de la boîte d'envoi (développement)
    volumes: [private:/var/clairtransit/private]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  frontend:
    build: ../frontend
    environment:
      VITE_API_PROXY: http://backend:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
  # Pièces des dossiers : hors de toute racine servie par le web.
  private:
  clamdb:
